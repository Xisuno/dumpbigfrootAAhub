name: WEAREDEVS Static Deobfuscation

on:
  workflow_dispatch:
    inputs:
      lua_file:
        description: 'Path to the Lua file in the repository'
        required: true
        default: 'script.lua'
        type: string

permissions:
  contents: read

jobs:
  deobfuscate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate input
        shell: bash
        env:
          LUA_FILE: ${{ inputs.lua_file }}
        run: |
          if [ ! -f "$LUA_FILE" ]; then
            echo "Lua file not found: $LUA_FILE"
            exit 1
          fi

      - name: Recover WEAREDEVS string table
        env:
          LUA_FILE: ${{ inputs.lua_file }}
        run: |
          python tools/wearedevs_static.py "$LUA_FILE" output

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: wearedevs-static-deobfuscation
          path: output/
          if-no-files-found: error


